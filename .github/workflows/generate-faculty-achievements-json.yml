name: Generate Faculty Achievements JSON

on:
  push:
    paths:
      - 'FACULTY ACHIEVEMENTS/**'
      - '.github/workflows/generate-faculty-achievements-json.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate Faculty Thumbnails and JSON
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          import subprocess

          folder = Path("FACULTY ACHIEVEMENTS")
          thumbnail_folder = folder / "thumbnails"
          output = Path("faculty-images.json")

          thumbnail_folder.mkdir(exist_ok=True)

          allowed = {
              ".jpg", ".jpeg", ".png",
              ".webp", ".gif", ".bmp", ".svg"
          }

          images = []

          for file in sorted(folder.iterdir(), key=lambda x: x.name.lower()):
              if not file.is_file():
                  continue

              if file.suffix.lower() not in allowed:
                  continue

              thumbnail = thumbnail_folder / file.name

              subprocess.run([
                  "magick",
                  str(file),
                  "-auto-orient",
                  "-thumbnail", "500x500>",
                  "-quality", "82",
                  str(thumbnail)
              ], check=True)

              images.append({
                  "name": file.name,
                  "thumbnail": f"../FACULTY ACHIEVEMENTS/thumbnails/{file.name}",
                  "original": f"../FACULTY ACHIEVEMENTS/{file.name}"
              })

          output.write_text(
              json.dumps(images, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Generated {len(images)} faculty thumbnails.")
          print(f"Generated {output}.")

          PY

      - name: Commit JSON and thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add faculty-images.json "FACULTY ACHIEVEMENTS/thumbnails/"

          if git diff --cached --quiet; then
            echo "No changes to faculty JSON or thumbnails"
          else
            git commit -m "Auto-generate faculty achievement thumbnails and JSON"
            git push
          fi
