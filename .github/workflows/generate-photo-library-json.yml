name: Generate Photo Library JSON

on:
  push:
    paths:
      - "ALL PHOTOS/**"
      - ".github/workflows/generate-photo-library-json.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate photo thumbnails and JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          from urllib.parse import quote

          folder = Path("ALL PHOTOS")
          thumbnail_root = folder / "thumbnails"
          output = Path("photo-library-images.json")

          thumbnail_root.mkdir(exist_ok=True)

          allowed = {
              ".jpg", ".jpeg", ".png", ".gif",
              ".webp", ".bmp", ".svg"
          }

          photos = []

          for path in sorted(folder.rglob("*")):
              if not path.is_file():
                  continue

              if path.suffix.lower() not in allowed:
                  continue

              # Never process images already inside thumbnails/
              if thumbnail_root in path.parents:
                  continue

              relative = path.relative_to(folder)
              thumbnail = thumbnail_root / relative

              thumbnail.parent.mkdir(parents=True, exist_ok=True)

              subprocess.run([
                  "convert",
                  str(path),
                  "-auto-orient",
                  "-thumbnail", "500x500>",
                  "-quality", "82",
                  str(thumbnail)
              ], check=True)

              original_url = "/".join(
                  quote(part) for part in relative.parts
              )

              thumbnail_url = "/".join(
                  quote(part)
                  for part in thumbnail.relative_to(folder).parts
              )

              photos.append({
                  "name": path.name,
                  "category": path.parent.name,
                  "thumbnail": "../ALL%20PHOTOS/" + thumbnail_url,
                  "original": "../ALL%20PHOTOS/" + original_url
              })

          output.write_text(
              json.dumps(photos, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(f"Generated {len(photos)} photos")
          print(f"JSON size: {output.stat().st_size / 1024:.2f} KB")
          PY

      - name: Commit generated JSON and thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add photo-library-images.json "ALL PHOTOS/thumbnails/"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate Photo Library thumbnails and JSON"
            git push
          fi
