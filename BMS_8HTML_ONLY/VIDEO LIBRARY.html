<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Library | Department of Biomedical Sciences</title>
<meta name="description" content="Video Library — Department of Biomedical Sciences, The Apollo University">

<style>
:root{
  --navy:#071a2b;
  --bg:#eef3f5;
  --line:#dce6ea;
  --teal:#087d95;
  --gold:#efb91c;
  --muted:#62717a;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 10% 10%,rgba(72,215,229,.08),transparent 28%),
    linear-gradient(135deg,#f7fafb,#eaf1f3);
  font-family:Arial,Helvetica,sans-serif;
  color:#15212a;
}

/* HEADER */
.header{
  position:relative;
  overflow:hidden;
  min-height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:
    radial-gradient(circle at 15% 20%,rgba(72,215,229,.18),transparent 28%),
    radial-gradient(circle at 85% 75%,rgba(25,181,165,.20),transparent 30%),
    linear-gradient(135deg,#061522,#0b2b43 55%,#073d4a);
}

.header-content{
  position:relative;
  z-index:2;
  padding:35px 20px;
}

.header h1{
  margin:0;
  font-size:clamp(30px,5vw,48px);
  letter-spacing:-.04em;
}

.header p{
  margin:9px 0 0;
  color:rgba(255,255,255,.75);
  font-size:14px;
}

/* MAIN OUTER BOX */
.video-box{
  width:min(1400px,calc(100% - 34px));
  margin:35px auto 60px;
  padding:25px;
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  border-radius:26px;
  box-shadow:
    0 25px 70px rgba(7,26,43,.13),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.video-inner{
  padding:18px;
  border:2px solid #e3ecef;
  border-radius:20px;
  background:#f8fafb;
}

/* VIDEO GRID */
.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

/* VIDEO CARD */
.video-card{
  width:100%;
  overflow:hidden;
  border:1px solid #d6e1e5;
  border-radius:17px;
  background:#fff;
  box-shadow:0 7px 22px rgba(7,26,43,.09);
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}

.video-card:hover{
  transform:translateY(-5px);
  border-color:#b9d5dc;
  box-shadow:0 18px 38px rgba(7,26,43,.15);
}

/* SAME VIDEO DISPLAY SIZE */
.video-wrap{
  width:100%;
  height:300px;
  padding:7px;
  background:#fff;
}

.video-wrap video{
  width:100%;
  height:100%;
  display:block;
  border-radius:11px;
  background:#000;
  object-fit:fill;
}

/* TITLE */
.video-title{
  padding:12px 13px;
  color:var(--navy);
  font-size:13px;
  font-weight:800;
  display:none;
}

/* EMPTY / ERROR */
.empty{
  display:none;
  text-align:center;
  padding:45px 20px;
  border:1px dashed #bfd4db;
  border-radius:17px;
  background:#fff;
  color:var(--muted);
}

/* FOOTER */
footer{
  background:#062534;
  color:#c9d9de;
  padding:28px 20px;
  text-align:center;
  font-size:11px;
}

/* RESPONSIVE */
@media(max-width:950px){
  .gallery{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){

  .video-box{
    width:calc(100% - 18px);
    padding:12px;
    margin-top:18px;
    border-radius:18px;
  }

  .video-inner{
    padding:9px;
    border-radius:13px;
  }

  .gallery{
    grid-template-columns:1fr;
    gap:12px;
  }

  .video-wrap{
    height:280px;
    padding:5px;
  }

  .video-wrap video{
    border-radius:9px;
  }

}
</style>
</head>

<body>

<header class="header">
  <div class="header-content">
    <h1>Video Library</h1>
    <p>Department of Biomedical Sciences</p>
  </div>
</header>

<main>

  <section class="video-box">

    <div class="video-inner">

      <div
        id="gallery"
        class="gallery"
        aria-label="Department Video Library">
      </div>

      <div id="empty" class="empty">
        No videos found in the Video Library.
      </div>

    </div>

  </section>

</main>

<footer>
  © The Apollo University · Department of Biomedical Sciences
</footer>

<script>

/* =========================================================
   VIDEO MANIFEST
   =========================================================

   GitHub Actions automatically generates:

   video-library.json

   The JSON contains video filenames and paths.
   No video filenames need to be manually added here.
   ========================================================= */

const VIDEO_MANIFEST = "../video-library.json";

const gallery = document.getElementById("gallery");
const empty = document.getElementById("empty");

let videos = [];


/* =========================================================
   LOAD VIDEO MANIFEST
   ========================================================= */

async function loadVideos(){

  try{

    const response = await fetch(
      VIDEO_MANIFEST + "?v=" + Date.now(),
      {
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error("Video manifest could not be loaded.");
    }

    const data = await response.json();

    videos = Array.isArray(data) ? data : [];

    renderVideos();

  }catch(error){

    console.error("Video Library:",error);

    gallery.innerHTML = "";

    empty.textContent =
      "Unable to load the Video Library.";

    empty.style.display = "block";

  }

}


/* =========================================================
   RENDER VIDEOS
   ========================================================= */

function renderVideos(){

  gallery.innerHTML = "";

  if(!videos.length){

    empty.textContent =
      "No videos found in the Video Library.";

    empty.style.display = "block";

    return;
  }

  empty.style.display = "none";

  videos.forEach(videoData => {

    const card =
      document.createElement("article");

    card.className =
      "video-card";


    const wrap =
      document.createElement("div");

    wrap.className =
      "video-wrap";


    const video =
      document.createElement("video");

    video.controls = true;

    video.preload = "metadata";

    video.playsInline = true;

    video.setAttribute(
      "aria-label",
      videoData.name ||
      "Department video"
    );


    const source =
      document.createElement("source");

    source.src =
      videoData.src;

    if(videoData.type){
      source.type =
        videoData.type;
    }


    video.appendChild(source);


    const title =
      document.createElement("div");

    title.className =
      "video-title";

    title.textContent =
      videoData.name ||
      "Department Video";


    wrap.appendChild(video);

    card.appendChild(wrap);

    card.appendChild(title);

    gallery.appendChild(card);

  });

}


/* =========================================================
   START
   ========================================================= */

loadVideos();

</script>

</body>
</html>
