<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Library | Department of Biomedical Sciences</title>
<style>
:root{--navy:#071b3a;--navy2:#0b2a57;--gold:#d9a441;--teal:#0d7f83;--bg:#f5f7fa;--text:#172033;--muted:#687386;--white:#fff}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{color:#fff;text-decoration:none;font-weight:700;font-size:18px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--gold);display:grid;place-items:center;font-size:22px}
.back{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:10px 15px;border-radius:8px}
.hero{padding:70px 5% 45px;background:#fff;text-align:center;border-bottom:1px solid #e4e8ee}
.hero h1{margin:0;font-size:clamp(34px,5vw,54px);color:var(--navy)}
.hero p{max-width:760px;margin:16px auto 0;color:var(--muted);line-height:1.7}
.container{max-width:1200px;margin:0 auto;padding:45px 5% 70px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.video-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px rgba(7,27,58,.08);border:1px solid #e8ebef}
.video-wrap{background:#000;aspect-ratio:16/9}
.video-wrap video{width:100%;height:100%;display:block}
.video-title{padding:16px 18px;font-weight:700;color:var(--navy)}
.empty{text-align:center;padding:70px 20px;background:#fff;border:1px dashed #ccd3dd;border-radius:16px;color:var(--muted)}
footer{background:var(--navy);color:#fff;text-align:center;padding:22px 5%;font-size:14px}
@media(max-width:850px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){header{padding:14px 4%}.brand span:last-child{display:none}.gallery{grid-template-columns:1fr}.hero{padding:50px 5% 35px}}
</style>
</head>
<body>
<header>
<a class="brand" href="index.html"><span class="logo">▶</span><span>Department of Biomedical Sciences</span></a>
<a class="back" href="index.html">← Back to Homepage</a>
</header>

<section class="hero">
<h1>Video Library</h1>
<p>Watch approved department videos, events, activities and other academic or institutional media.</p>
</section>

<main class="container">
<section id="gallery" class="gallery" aria-label="All videos"></section>
<div id="empty" class="empty" hidden>No videos have been added yet.</div>
</main>

<footer>Department of Biomedical Sciences · The Apollo University</footer>

<script>
const videos = [
  // Add approved videos here:
  // { src: "videos/example.mp4", title: "Example Video" },
];

const gallery = document.getElementById("gallery");
const empty = document.getElementById("empty");

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function escapeAttr(value){ return escapeHtml(value); }

if (!videos.length) {
  empty.hidden = false;
} else {
  gallery.innerHTML = videos.map(video => `
    <article class="video-card">
      <div class="video-wrap">
        <video controls preload="metadata">
          <source src="${escapeAttr(video.src)}">
          Your browser does not support video playback.
        </video>
      </div>
      <div class="video-title">${escapeHtml(video.title || "Department Video")}</div>
    </article>
  `).join("");
}
</script>
</body>
</html>
