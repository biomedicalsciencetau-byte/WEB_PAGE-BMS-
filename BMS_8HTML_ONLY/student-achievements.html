<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Achievements</title>

<style>

:root{
  --navy:#071a2b;
  --bg:#eef3f5;
  --line:#dce6ea;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 10% 10%,rgba(72,215,229,.08),transparent 28%),
    linear-gradient(135deg,#f7fafb,#eaf1f3);
  font-family:Arial,Helvetica,sans-serif;
}


/* =========================
   HEADER
========================= */

.header{
  position:relative;
  overflow:hidden;
  min-height:190px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;
  color:white;

  background:
    radial-gradient(circle at 15% 20%,rgba(72,215,229,.18),transparent 28%),
    radial-gradient(circle at 85% 75%,rgba(25,181,165,.20),transparent 30%),
    linear-gradient(135deg,#061522,#0b2b43 55%,#073d4a);
}

.header-content{
  position:relative;
  z-index:2;
  padding:35px 20px;
}

.header h1{
  margin:0;
  font-size:clamp(30px,5vw,48px);
  letter-spacing:-.04em;
}

.header p{
  margin:9px 0 0;
  color:rgba(255,255,255,.75);
  font-size:14px;
}


/* =========================
   MAIN GALLERY BOX
========================= */

.gallery-box{
  width:min(1400px,calc(100% - 34px));
  margin:35px auto 60px;

  padding:25px;

  background:rgba(255,255,255,.94);

  border:1px solid var(--line);
  border-radius:26px;

  box-shadow:
    0 25px 70px rgba(7,26,43,.13),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.gallery-inner{
  padding:18px;

  border:2px solid #e3ecef;
  border-radius:20px;

  background:#f8fafb;
}


/* =========================
   PHOTO GRID
========================= */

.gallery{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:18px;
}


/* =========================
   PHOTO BOX
========================= */

.photo-box{
  position:relative;

  overflow:hidden;

  height:300px;

  padding:7px;

  border:1px solid #d6e1e5;
  border-radius:17px;

  background:white;

  box-shadow:0 7px 22px rgba(7,26,43,.09);

  cursor:pointer;

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}

.photo-box:hover{
  transform:translateY(-5px);

  border-color:#b9d5dc;

  box-shadow:0 18px 38px rgba(7,26,43,.15);
}

.photo-box img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  border-radius:11px;

  transition:transform .5s ease;
}

.photo-box:hover img{
  transform:scale(1.04);
}


/* =========================
   IMAGE ERROR PLACEHOLDER
========================= */

.placeholder{
  width:100%;
  height:100%;

  display:grid;
  place-items:center;

  border-radius:11px;

  color:#71838c;

  font-size:13px;

  text-align:center;

  background:
    linear-gradient(135deg,#edf3f5,#e1eaed);
}


/* =========================
   LOADING MESSAGE
========================= */

.loading{
  grid-column:1/-1;

  padding:50px 20px;

  text-align:center;

  color:#71838c;

  font-size:15px;
}


/* =========================
   ERROR MESSAGE
========================= */

.error{
  grid-column:1/-1;

  padding:50px 20px;

  text-align:center;

  color:#9b3d3d;

  background:#fff5f5;

  border:1px solid #f0d2d2;

  border-radius:15px;
}


/* =========================
   FULLSCREEN LIGHTBOX
========================= */

.lightbox{
  position:fixed;

  inset:0;

  z-index:9999;

  display:none;

  align-items:center;
  justify-content:center;

  padding:25px;

  background:rgba(2,10,17,.95);

  backdrop-filter:blur(12px);
}

.lightbox.open{
  display:flex;
}

.lightbox img{
  max-width:94vw;
  max-height:92vh;

  object-fit:contain;

  border-radius:12px;

  box-shadow:
    0 25px 90px rgba(0,0,0,.55);
}


/* =========================
   CLOSE BUTTON
========================= */

.close{
  position:fixed;

  top:18px;
  right:22px;

  width:46px;
  height:46px;

  border:0;

  border-radius:50%;

  color:white;

  background:rgba(255,255,255,.13);

  font-size:28px;

  cursor:pointer;
}

.close:hover{
  background:rgba(255,255,255,.25);
}


/* =========================
   TABLET
========================= */

@media(max-width:950px){

  .gallery{
    grid-template-columns:repeat(2,1fr);
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .gallery-box{
    width:calc(100% - 18px);

    padding:12px;

    margin-top:18px;

    border-radius:18px;
  }

  .gallery-inner{
    padding:9px;

    border-radius:13px;
  }

  .gallery{
    grid-template-columns:1fr;

    gap:12px;
  }

  .photo-box{
    height:300px;

    padding:5px;

    border-radius:13px;
  }

  .photo-box img{
    border-radius:9px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="header-content">

    <h1>Student Achievements</h1>

    <p>Biomedical Sciences</p>

  </div>

</header>



<!-- =========================
     GALLERY
========================= -->

<section class="gallery-box">

  <div class="gallery-inner">

    <div
      class="gallery"
      id="gallery"
    >

      <div class="loading">
        Loading student achievements...
      </div>

    </div>

  </div>

</section>



<!-- =========================
     LIGHTBOX
========================= -->

<div
  class="lightbox"
  id="lightbox"
>

  <button
    class="close"
    id="closeBtn"
    aria-label="Close"
  >
    ×
  </button>

  <img
    id="lightboxImage"
    src=""
    alt=""
  >

</div>



<script>

/* =========================
   ELEMENTS
========================= */

const gallery =
  document.getElementById("gallery");

const lightbox =
  document.getElementById("lightbox");

const lightboxImage =
  document.getElementById("lightboxImage");

const closeBtn =
  document.getElementById("closeBtn");



/* =========================
   LOAD STUDENT ACHIEVEMENTS
========================= */

async function loadStudentAchievements(){

  try{

    const response = await fetch(
      "../student-achievements.json?v=" + Date.now(),
      {
        cache:"no-store"
      }
    );


    if(!response.ok){

      throw new Error(
        "student-achievements.json could not be loaded"
      );

    }


    const photos =
      await response.json();


    gallery.innerHTML = "";


    if(!photos.length){

      gallery.innerHTML =
        '<div class="loading">No student achievement images found.</div>';

      return;

    }


    /* =========================
       CREATE PHOTO CARDS
    ========================= */

    photos.forEach(photo => {

      const box =
        document.createElement("div");

      box.className =
        "photo-box";


      const img =
        document.createElement("img");


      img.src =
        photo.thumbnail;

      img.alt =
        photo.name || "";

      img.loading =
        "lazy";


      /* =========================
         PLACEHOLDER
      ========================= */

      const placeholder =
        document.createElement("div");

      placeholder.className =
        "placeholder";

      placeholder.textContent =
        "Image not found";

      placeholder.style.display =
        "none";


      img.onerror = () => {

        img.style.display =
          "none";

        placeholder.style.display =
          "grid";

      };


      box.appendChild(img);

      box.appendChild(placeholder);


      /* =========================
         OPEN LIGHTBOX
      ========================= */

      box.onclick = () => {

        if(
          img.style.display !== "none"
        ){

          lightboxImage.src =
            photo.original;

          lightboxImage.alt =
            img.alt;

          lightbox.classList.add(
            "open"
          );

          document.body.style.overflow =
            "hidden";

        }

      };


      gallery.appendChild(box);

    });


  }

  catch(error){

    console.error(
      "Student Achievements error:",
      error
    );


    gallery.innerHTML = `

      <div class="error">

        Unable to load the
        Student Achievements.

        <br><br>

        Please try again later.

      </div>

    `;

  }

}



/* =========================
   CLOSE LIGHTBOX
========================= */

function closeLightbox(){

  lightbox.classList.remove(
    "open"
  );

  lightboxImage.src =
    "";

  document.body.style.overflow =
    "";

}


closeBtn.onclick =
  closeLightbox;



/* =========================
   CLOSE WHEN CLICKING OUTSIDE
========================= */

lightbox.onclick = event => {

  if(
    event.target === lightbox
  ){

    closeLightbox();

  }

};



/* =========================
   ESCAPE KEY
========================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      closeLightbox();

    }

  }
);



/* =========================
   START
========================= */

loadStudentAchievements();

</script>


</body>
</html>
