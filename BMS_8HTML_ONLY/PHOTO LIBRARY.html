<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Library | Department of Biomedical Sciences</title>
<meta name="description" content="Photo Library — Department of Biomedical Sciences, The Apollo University">

<style>
:root{
  --navy:#071a2b;
  --bg:#eef3f5;
  --line:#dce6ea;
  --teal:#087d95;
  --gold:#efb91c;
  --muted:#62717a;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 10% 10%,rgba(72,215,229,.08),transparent 28%),
    linear-gradient(135deg,#f7fafb,#eaf1f3);
  font-family:Arial,Helvetica,sans-serif;
  color:#15212a;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
  position:relative;
  overflow:hidden;
  min-height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:
    radial-gradient(circle at 15% 20%,rgba(72,215,229,.18),transparent 28%),
    radial-gradient(circle at 85% 75%,rgba(25,181,165,.20),transparent 30%),
    linear-gradient(135deg,#061522,#0b2b43 55%,#073d4a);
}

.header-content{
  position:relative;
  z-index:2;
  padding:35px 20px;
}

.header h1{
  margin:0;
  font-size:clamp(30px,5vw,48px);
  letter-spacing:-.04em;
}

.header p{
  margin:9px 0 0;
  color:rgba(255,255,255,.75);
  font-size:14px;
}

/* =========================================================
   MAIN PHOTO CONTAINER
   ========================================================= */

.gallery-box{
  width:min(1400px,calc(100% - 34px));
  margin:35px auto 60px;
  padding:25px;
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  border-radius:26px;
  box-shadow:
    0 25px 70px rgba(7,26,43,.13),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.gallery-inner{
  padding:18px;
  border:2px solid #e3ecef;
  border-radius:20px;
  background:#f8fafb;
}

/* =========================================================
   PHOTO GRID
   ========================================================= */

.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

/* =========================================================
   PHOTO BOX
   ========================================================= */

.photo-box{
  width:100%;
  height:300px;
  position:relative;
  overflow:hidden;
  padding:7px;
  border:1px solid #d6e1e5;
  border-radius:17px;
  background:#fff;
  box-shadow:0 7px 22px rgba(7,26,43,.09);
  cursor:pointer;
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}

.photo-box:hover{
  transform:translateY(-5px);
  border-color:#b9d5dc;
  box-shadow:0 18px 38px rgba(7,26,43,.15);
}

/*
   IMPORTANT:
   The image is forced to the exact dimensions of the
   inner photo area. This makes every displayed image
   exactly match the same-size box.
*/
.photo-box img{
  width:100%;
  height:100%;
  display:block;
  object-fit:fill;
  border-radius:11px;
  transition:transform .5s ease;
}

.photo-box:hover img{
  transform:scale(1.02);
}

/* =========================================================
   IMAGE ERROR PLACEHOLDER
   ========================================================= */

.placeholder{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  border-radius:11px;
  color:#71838c;
  font-size:13px;
  text-align:center;
  background:linear-gradient(135deg,#edf3f5,#e1eaed);
}

/* =========================================================
   EMPTY MESSAGE
   ========================================================= */

.empty{
  display:none;
  text-align:center;
  padding:45px 20px;
  border:1px dashed #bfd4db;
  border-radius:17px;
  background:#fff;
  color:var(--muted);
}

/* =========================================================
   FULLSCREEN LIGHTBOX
   ========================================================= */

.lightbox{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:rgba(2,10,17,.95);
  backdrop-filter:blur(12px);
}

.lightbox.open{
  display:flex;
}

.lightbox img{
  max-width:94vw;
  max-height:92vh;
  object-fit:contain;
  border-radius:12px;
  box-shadow:0 25px 90px rgba(0,0,0,.55);
  background:#fff;
}

.close{
  position:fixed;
  top:18px;
  right:22px;
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  color:#fff;
  background:rgba(255,255,255,.13);
  font-size:28px;
  cursor:pointer;
}

.close:hover{
  background:rgba(255,255,255,.25);
}

/* =========================================================
   FOOTER
   ========================================================= */

footer{
  background:#062534;
  color:#c9d9de;
  padding:28px 20px;
  text-align:center;
  font-size:11px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:950px){

  .gallery{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .gallery-box{
    width:calc(100% - 18px);
    padding:12px;
    margin-top:18px;
    border-radius:18px;
  }

  .gallery-inner{
    padding:9px;
    border-radius:13px;
  }

  .gallery{
    grid-template-columns:1fr;
    gap:12px;
  }

  .photo-box{
    height:280px;
    padding:5px;
    border-radius:13px;
  }

  .photo-box img{
    border-radius:9px;
  }

}

</style>
<style id="biomedical-floating-objects-style">
/* Ambient biomedical objects: decorative, non-interactive, and lightweight */
.bio-float-field{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;contain:strict;opacity:.56}
.bio-float{position:absolute;display:grid;place-items:center;width:clamp(28px,3.4vw,52px);height:clamp(28px,3.4vw,52px);font-size:clamp(24px,2.8vw,42px);line-height:1;filter:drop-shadow(0 5px 8px rgba(27,89,83,.13));opacity:var(--o,.58);animation:bioDrift var(--dur,17s) ease-in-out infinite alternate;animation-delay:var(--delay,0s);transform:translate3d(0,0,0)}
.bio-float svg{width:100%;height:100%;overflow:visible}
@keyframes bioDrift{0%{transform:translate3d(0,0,0) rotate(-8deg)}50%{transform:translate3d(var(--dx,12px),-22px,0) rotate(8deg)}100%{transform:translate3d(calc(var(--dx,12px) * -1),12px,0) rotate(-5deg)}}
html[data-theme="dark"] .bio-float-field{opacity:.34}
@media(prefers-reduced-motion:reduce){.bio-float{animation:none!important}}
@media(max-width:700px){.bio-float-field{opacity:.36}.bio-float{width:27px;height:27px;font-size:25px}}
</style>

.bio-float{width:clamp(34px,4.2vw,64px);height:clamp(34px,4.2vw,64px);font-size:clamp(29px,3.5vw,49px);will-change:transform;animation:bioTravel var(--dur,14s) ease-in-out infinite;animation-delay:var(--delay,0s);filter:drop-shadow(0 7px 12px rgba(27,89,83,.22))}

.bio-float:nth-child(4n){animation-name:bioRise;animation-duration:var(--dur,16s)}
@keyframes bioRise{0%{transform:translate3d(0,35px,0) rotate(-14deg)}50%{transform:translate3d(30px,-65px,0) rotate(14deg)}100%{transform:translate3d(-22px,25px,0) rotate(-10deg)}}
html[data-theme="dark"] .bio-float-field{opacity:.58}
@media(max-width:700px){.bio-float-field{opacity:.43}.bio-float{width:30px;height:30px;font-size:27px}}

</style>
<style id="biomedical-floating-free-space-fix">
/* V10: keep animated biomedical objects behind the page content, visible only in open/background space */
.bio-float-field{z-index:0!important;opacity:.42!important;pointer-events:none!important;mix-blend-mode:multiply}
.bio-float{z-index:0!important;filter:drop-shadow(0 3px 6px rgba(27,89,83,.12))!important}
/* Ensure normal content paints above the ambient floating layer */
body>.reading-progress,body>.topbar,body>header,body>nav,body>main,body>section,body>footer,body>.modal,body>.search-overlay,body>.container{position:relative;z-index:1}
html[data-theme="dark"] .bio-float-field{opacity:.22!important;mix-blend-mode:screen}
@media(max-width:700px){.bio-float-field{opacity:.24!important}.bio-float{font-size:24px!important}}
@media(prefers-reduced-motion:reduce){.bio-float{animation:none!important}}
</style>
<style id="biomedical-floating-efficiency-v11">
/* V11: lighter, smoother ambient motion; keep objects subtle and out of the way */
.bio-float-field{opacity:.30!important;contain:strict;isolation:isolate}
.bio-float{width:clamp(26px,3vw,44px)!important;height:clamp(26px,3vw,44px)!important;font-size:clamp(23px,2.6vw,36px)!important;filter:drop-shadow(0 2px 4px rgba(27,89,83,.10))!important;will-change:transform;backface-visibility:hidden}
html[data-theme="dark"] .bio-float-field{opacity:.20!important}
@media(max-width:700px){.bio-float-field{opacity:.18!important}.bio-float{width:24px!important;height:24px!important;font-size:22px!important}}
@media(prefers-reduced-motion:reduce){.bio-float-field{display:none!important}.bio-float{animation:none!important;will-change:auto!important}}
</style>
<style id="biomedical-floating-brightness-v12">
/* V12: slightly brighter ambient biomedical objects while preserving readable content */
.bio-float-field{opacity:.43!important}
.bio-float{filter:drop-shadow(0 3px 7px rgba(28,116,106,.20))!important}
html[data-theme="dark"] .bio-float-field{opacity:.30!important}
@media(max-width:700px){.bio-float-field{opacity:.27!important}}
@media(prefers-reduced-motion:reduce){.bio-float-field{display:none!important}}
</style>
<style id="apollo-v13-unified-theme">

header,nav,.topbar,.navbar,.site-header,.main-header,.header,.hero,.page-header,.banner,.title-bar,.section-header{background:linear-gradient(120deg,#062c3c,#0b5368)!important;color:#fff!important}
header a,nav a,.topbar a,.navbar a,.site-header a,.main-header a,.header a,.hero a,.page-header a,.banner a{color:#fff!important}
button,.btn,.button,input[type=submit],.submit-btn,.filter-btn.active,.tab.active{background:#087d95!important;color:#fff!important;border-color:#087d95!important}
button:hover,.btn:hover,.button:hover,input[type=submit]:hover{background:#06586b!important}
.card,.panel,.tile,.content-card,.faculty-card,.research-card,.gallery-card,.achievement-card,.project-card,.article-card,.video-card,.photo-card,.stat-card,.box,.modal-content{border-color:#d8e7eb!important;box-shadow:0 10px 28px rgba(6,44,60,.09)!important}
.card,.panel,.tile,.content-card,.faculty-card,.research-card,.gallery-card,.achievement-card,.project-card,.article-card,.video-card,.photo-card,.stat-card{background:rgba(255,255,255,.96)!important}
h1,h2,h3,h4,.section-title,.page-title{color:#062c3c}
a{transition:color .2s ease} a:hover{color:#087d95}
input,select,textarea{border-color:#c7dce2!important} input:focus,select:focus,textarea:focus{outline:2px solid rgba(8,125,149,.25)!important;border-color:#087d95!important}
footer,.footer,.site-footer{background:#062c3c!important;color:#f3f8fa!important} footer a,.footer a,.site-footer a{color:#f3f8fa!important}
/* Ensure ambient objects stay behind text, controls, and images */
body>*:not(.bio-float-field){position:relative;z-index:1} body>.bio-float-field{position:fixed!important;z-index:0!important}
img, picture, figure, article, main, section, .container, .content, .wrapper{position:relative;z-index:1}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<header class="header">
  <div class="header-content">
    <h1>Photo Library</h1>
    <p>Department of Biomedical Sciences</p>
  </div>
</header>

<main>

  <section class="gallery-box">

    <div class="gallery-inner">

      <div
        id="gallery"
        class="gallery"
        aria-label="Department Photo Library">
      </div>

      <div id="empty" class="empty">
        No photos found in the Photo Library.
      </div>

    </div>

  </section>

</main>

<!-- =======================================================
     FULLSCREEN IMAGE VIEWER
     ======================================================= -->

<div
  id="lightbox"
  class="lightbox"
  role="dialog"
  aria-modal="true"
  aria-label="Photo viewer">

  <button
    id="closeBtn"
    class="close"
    type="button"
    aria-label="Close photo viewer">
    ×
  </button>

  <img
    id="lightboxImage"
    src=""
    alt="">
</div>

<footer>
  © The Apollo University · Department of Biomedical Sciences
</footer>

<script>

/* =========================================================
   PHOTO MANIFEST
   =========================================================

   GitHub Actions automatically generates:

   photo-library-images.json

   The JSON contains the image filenames and paths.
   No filenames need to be manually added here.
   ========================================================= */

const PHOTO_MANIFEST = "../photo-library-images.json";

const gallery = document.getElementById("gallery");
const empty = document.getElementById("empty");

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const closeBtn = document.getElementById("closeBtn");

let photos = [];


/* =========================================================
   LOAD PHOTO MANIFEST
   ========================================================= */

async function loadPhotos(){

  try{

    const response = await fetch(
      PHOTO_MANIFEST + "?v=" + Date.now(),
      {
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error("Photo manifest could not be loaded.");
    }

    const data = await response.json();

    photos = Array.isArray(data) ? data : [];

    renderPhotos();

  }catch(error){

    console.error("Photo Library:",error);

    gallery.innerHTML = "";

    empty.textContent =
      "Unable to load the Photo Library.";

    empty.style.display = "block";

  }

}


/* =========================================================
   RENDER PHOTOS
   ========================================================= */

function renderPhotos(){

  gallery.innerHTML = "";

  if(!photos.length){

    empty.textContent =
      "No photos found in the Photo Library.";

    empty.style.display = "block";

    return;
  }

  empty.style.display = "none";

  photos.forEach((photo,index)=>{

    const box = document.createElement("article");

    box.className = "photo-box";

    box.tabIndex = 0;

    box.setAttribute(
      "role",
      "button"
    );

    box.setAttribute(
      "aria-label",
      "Open photo " + (index + 1)
    );


    const img = document.createElement("img");

    img.src = photo.thumbnail;

    img.alt =
      photo.name ||
      "Department of Biomedical Sciences photo";

    img.loading = "lazy";

    img.decoding = "async";


    const placeholder =
      document.createElement("div");

    placeholder.className =
      "placeholder";

    placeholder.textContent =
      "Image not available";

    placeholder.style.display =
      "none";


    img.onerror = function(){

      img.style.display = "none";

      placeholder.style.display =
        "grid";

    };


    box.appendChild(img);

    box.appendChild(placeholder);


    function openPhoto(){

      if(img.style.display === "none"){
        return;
      }

      lightboxImage.src = photo.original;

      lightboxImage.alt =
        img.alt;

      lightbox.classList.add("open");

      document.body.style.overflow =
        "hidden";

    }


    box.addEventListener(
      "click",
      openPhoto
    );


    box.addEventListener(
      "keydown",
      event => {

        if(
          event.key === "Enter" ||
          event.key === " "
        ){

          event.preventDefault();

          openPhoto();

        }

      }
    );


    gallery.appendChild(box);

  });

}


/* =========================================================
   CLOSE LIGHTBOX
   ========================================================= */

function closeLightbox(){

  lightbox.classList.remove("open");

  lightboxImage.removeAttribute("src");

  lightboxImage.removeAttribute("alt");

  document.body.style.overflow = "";

}


closeBtn.addEventListener(
  "click",
  closeLightbox
);


lightbox.addEventListener(
  "click",
  event => {

    if(event.target === lightbox){

      closeLightbox();

    }

  }
);


document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      closeLightbox();

    }

  }
);


/* =========================================================
   START
   ========================================================= */

loadPhotos();

</script>

</body>
